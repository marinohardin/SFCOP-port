name: Pull request

on:
  pull_request:
    branches: [main, develop, "feature/**"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push to a pull request replaces the run of the previous one.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # One job, because every job is billed in whole minutes and pays for its own install.
  check:
    runs-on: [self-hosted, sfcop-mac]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The checkout is the merge of the pull request into its base. Its first parent is
          # the base, so two commits are enough to list what the pull request changes.
          fetch-depth: 2

      - uses: ./.github/actions/setup

      - name: The definition of done
        run: sh scripts/check.sh

  # The native build (DESIGN §7.4), one job per preset: macos-arm64 with Apple clang, windows-x64
  # and linux-x64 cross-compiled on the same Mac (cmake/toolchains/README.md). A pull request that
  # changes only game/, analysis/results/ and the generated override table builds macos-arm64
  # alone (oracle/presets/ci.py, "builds"). Every job that builds makes sfcop_tests and runs it
  # (windows-x64 under Wine, linux-x64 in a linux/amd64 container), builds sfcop with the lift
  # where the runner has the install and pcrecomp, and keeps sfcop_tests and the configure and test
  # logs for 7 days as an artifact of this private repository, for the owner's own review. The
  # lifted sfcop is derived from the retail executable and is never uploaded; nothing is released
  # or published (DESIGN §12.2).
  #
  # The jobs run one after another (max-parallel: 1) on one shared runner, so a hang costs every
  # other pull request: each step has its own timeout, well under the job's. The build trees live
  # outside the checkout, one set per runner, so that the lift (about 6 minutes) and the lifted
  # objects carry over from run to run: the lift is keyed by its inputs and reruns only when they
  # change. The runner needs the install and the pcrecomp clone where cmake/SfcopLifter.cmake
  # looks for them, or SFCOP_INSTALL_DIR and SFCOP_PCRECOMP_DIR in its environment;
  # SFCOP_CI_BUILD_ROOT moves the build trees (default: the tool cache); the cross toolchains are
  # found through SFCOP_TOOLS_DIR (cmake/toolchains/README.md, "The runner"). CI installs no
  # toolchain: a missing one fails the configure step with the command that installs it.
  build:
    name: build (${{ matrix.preset }})
    runs-on: [self-hosted, sfcop-mac]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        preset: [macos-arm64, windows-x64, linux-x64]
        include:
          - preset: macos-arm64
            lift: "on"
          - preset: linux-x64
            lift: "on"
          # Not yet: pcrecomp's win32hle runtime includes POSIX headers (unistd.h, pthread.h,
          # strings.h) and src/app/guest/GuestExceptions.cpp leaves g_raiseShim and g_liftedCode
          # undeclared on Windows; both reported. The job builds and tests src/ until they build.
          - preset: windows-x64
            lift: "not yet: the lift's runtime and the guest host do not build for Windows (reported)"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A pull request that changes only decompiled source and its records builds macOS alone
      # (oracle/presets/ci.py, "builds"); the other presets' steps are skipped and the job passes.
      - name: Is ${{ matrix.preset }} built for this pull request
        id: want
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          set -eu -o pipefail
          build=$(git diff --name-only HEAD^1 HEAD | python3 -I oracle/presets/ci.py builds "$PRESET")
          [ "$build" = yes ] || echo "::notice::skip: $PRESET: this pull request changes only decompiled source; macos-arm64 builds it"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # A missing macOS permission to read the external tools volume would otherwise stall the
      # first compiler run for the whole timeout (cmake/toolchains/README.md, "The runner").
      - name: Check the toolchain is readable
        if: steps.want.outputs.build == 'yes' && matrix.preset != 'macos-arm64'
        timeout-minutes: 2
        env:
          PRESET: ${{ matrix.preset }}
        run: sh cmake/toolchains/check-readable.sh "$PRESET"

      - name: Configure ${{ matrix.preset }}
        if: steps.want.outputs.build == 'yes'
        timeout-minutes: 5
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          LIFT: ${{ matrix.lift }}
        run: |
          set -eu
          root="${SFCOP_CI_BUILD_ROOT:-$RUNNER_TOOL_CACHE/sfcop-build}/$RUNNER_NAME"
          echo "SFCOP_BUILD_DIR=$root/$PRESET" >> "$GITHUB_ENV"
          mkdir -p "$root/$PRESET/logs"
          # The lift and sfcop need the install and the pcrecomp clone, which the runner's
          # environment file names. Without them, build src/ and the tests only.
          if [ "$LIFT" != on ]; then
            echo "skip: the lift and sfcop on $PRESET: $LIFT"
            set -- -DSFCOP_LIFT=OFF
          elif [ -n "${SFCOP_INSTALL_DIR:-}" ] && [ -n "${SFCOP_PCRECOMP_DIR:-}" ]; then
            set -- -DSFCOP_LIFT=ON "-DSFCOP_INSTALL_DIR=$SFCOP_INSTALL_DIR" "-DSFCOP_PCRECOMP_DIR=$SFCOP_PCRECOMP_DIR"
          else
            echo "skip: the lift and sfcop: SFCOP_INSTALL_DIR or SFCOP_PCRECOMP_DIR is not set on this runner"
            set -- -DSFCOP_LIFT=OFF
          fi
          cmake --preset "$PRESET" -B "$root/$PRESET" "$@" 2>&1 | tee "$root/$PRESET/logs/configure.log"

      - name: Build ${{ matrix.preset }}
        if: steps.want.outputs.build == 'yes'
        timeout-minutes: 15
        # nice 5, not 19: on Apple Silicon a niceness of 19 keeps the compiles on the efficiency
        # cores even when the machine is idle, and a full rebuild then outruns the timeout.
        # -j4 still caps the load when agents share the machine.
        run: nice -n 5 cmake --build "$SFCOP_BUILD_DIR" -j4

      # The cross presets run their tests through the emulator and keep the test cases
      # cmake/toolchains/expected-failures.tsv names (each with its defect, described in
      # cmake/toolchains/README.md "Known failures") out of the verdict, running them once more
      # for the record.
      - name: C++ tests
        if: steps.want.outputs.build == 'yes'
        timeout-minutes: 10
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          if [ "$PRESET" = macos-arm64 ]; then
            ctest --test-dir "$SFCOP_BUILD_DIR" --output-on-failure --timeout 540 2>&1 | tee "$SFCOP_BUILD_DIR/logs/tests.log"
          else
            sh cmake/toolchains/run-tests.sh "$PRESET" "$SFCOP_BUILD_DIR" 2>&1 | tee "$SFCOP_BUILD_DIR/logs/tests.log"
          fi

      - name: Keep the tests and the logs for 7 days
        if: steps.want.outputs.build == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: sfcop-${{ matrix.preset }}-pr${{ github.event.pull_request.number }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ env.SFCOP_BUILD_DIR }}/sfcop_tests
            ${{ env.SFCOP_BUILD_DIR }}/sfcop_tests.exe
            ${{ env.SFCOP_BUILD_DIR }}/logs/configure.log
            ${{ env.SFCOP_BUILD_DIR }}/logs/tests.log

  # The replay oracle on the three presets (DESIGN §5.10, §7.4): the lifted client of each
  # preset's build plays the oracle's input headless, on a copy of the runner's prepared data
  # folder, and the traces are compared pairwise and with oracle/expected/
  # (oracle/presets/README.md). Runs after the builds, one preset at a time at nice 19, and only
  # for a pull request that touches game/, src/ or the oracle's own runner, driver, trace tools or
  # this workflow. The logic (which paths, what each exit means, the warnings) is
  # oracle/presets/ci.py, tested in tests/test_oracle_presets.py.
  #
  # Runner variables, set by the owner and never printed:
  #   SFCOP_ORACLE_DATA     the prepared data folder (a stored key). Unset: the job warns and skips.
  #   SFCOP_ORACLE_MODULES  the modules root for the skirmish: <root>/<preset>/OracleSkirmish/, each
  #                         translated on that preset's toolchain. Unset: the skirmish step skips.
  # A preset without a lifted client skips with a ::warning:: naming it and why. The menu path is
  # compared today; the skirmish step runs when oracle/driver/skirmish.steps exists, the modules
  # are there and the client has A2's --logs flag. Traces (hashes of behaviour, nothing of the
  # retail files) are kept for 7 days.
  oracle:
    name: oracle (all presets)
    needs: build
    runs-on: [self-hosted, sfcop-mac]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Does this pull request touch what the oracle judges
        id: gate
        shell: bash
        run: |
          set -eu -o pipefail
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          [ -s "$RUNNER_TEMP/changed.txt" ] || { echo "::error::no changed paths between HEAD^1 and HEAD"; exit 1; }
          echo "CHANGED=$RUNNER_TEMP/changed.txt" >> "$GITHUB_ENV"
          run=$(python3 -I oracle/presets/ci.py gate < "$RUNNER_TEMP/changed.txt")
          if [ "$run" = no ]; then
            echo "::notice::skip: the oracle on the presets: nothing under game/, src/ or the oracle's runner changed"
          elif [ -z "${SFCOP_ORACLE_DATA:-}" ]; then
            echo "::warning::skip: the oracle on the presets did not run: SFCOP_ORACLE_DATA is not set on this runner (the owner sets it to the prepared data folder)"
            run=no
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          root="${SFCOP_CI_BUILD_ROOT:-$RUNNER_TOOL_CACHE/sfcop-build}/$RUNNER_NAME"
          traces="$RUNNER_TEMP/oracle-traces"
          rm -rf "$traces"; mkdir -p "$traces"
          echo "BUILD_ROOT=$root" >> "$GITHUB_ENV"
          echo "TRACES=$traces" >> "$GITHUB_ENV"

      - name: The menu path on each preset
        if: steps.gate.outputs.run == 'yes'
        timeout-minutes: 15
        shell: bash
        run: python3 -I oracle/presets/ci.py run MenuPath menu --build-root "$BUILD_ROOT" --traces "$TRACES" --env-file "$GITHUB_ENV" --changed "$CHANGED"

      - name: Compare the menu path
        if: steps.gate.outputs.run == 'yes'
        timeout-minutes: 2
        shell: bash
        run: python3 -I oracle/presets/ci.py compare MenuPath menu --traces "$TRACES" --ran "${RAN_MENUPATH:-}" --expected oracle/expected

      # 20 minutes per preset (the client's watchdog is 15); lower both to what A2 measures.
      - name: The oracle skirmish on each preset
        if: steps.gate.outputs.run == 'yes' && hashFiles('oracle/driver/skirmish.steps') != ''
        timeout-minutes: 60
        shell: bash
        run: |
          if [ -z "${SFCOP_ORACLE_MODULES:-}" ]; then
            echo "::warning::skip: the oracle skirmish did not run: SFCOP_ORACLE_MODULES is not set on this runner"
            echo "RAN_ORACLESKIRMISH=" >> "$GITHUB_ENV"
            exit 0
          fi
          python3 -I oracle/presets/ci.py run OracleSkirmish skirmish --build-root "$BUILD_ROOT" --traces "$TRACES" --env-file "$GITHUB_ENV" --changed "$CHANGED"

      - name: Compare the skirmish
        if: steps.gate.outputs.run == 'yes' && hashFiles('oracle/driver/skirmish.steps') != ''
        timeout-minutes: 2
        shell: bash
        run: python3 -I oracle/presets/ci.py compare OracleSkirmish skirmish --traces "$TRACES" --ran "${RAN_ORACLESKIRMISH:-}" --expected oracle/expected

      - name: Keep the traces for 7 days
        if: steps.gate.outputs.run == 'yes' && always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-traces-pr${{ github.event.pull_request.number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ env.TRACES }}/**/*.trace
            ${{ env.TRACES }}/**/*.timings
